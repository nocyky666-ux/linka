name: 🤖 LINKA – Build Android APK & Deploy PWA

on:
  push:
    branches: [ main, develop, release/* ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release ]
      upload_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID:      app.linka.connect
  APP_NAME:    LINKA
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

# ─────────────────────────────────────────────────────────────────────
jobs:

# ──────────────────────────────────────
  validate:
    name: 🔍 Validate Project
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build:   ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📋 Validate files
        run: |
          echo "🔍 Checking required files…"
          MISSING=0
          for f in index.html manifest.json sw.js capacitor.config.json package.json; do
            [ -f "$f" ] && echo "✅ $f" || { echo "❌ $f missing"; MISSING=1; }
          done
          [ -f "assets/logo/logo.png" ] && echo "✅ logo.png ($(du -sh assets/logo/logo.png | cut -f1))" || echo "⚠️ logo.png missing – using fallback"
          [ -f "assets/fonts/800.ttf"     ] && echo "✅ 800.ttf font" || echo "⚠️ 800.ttf missing"
          [ -f "assets/fonts/iOS18_4.ttf" ] && echo "✅ iOS18_4.ttf emoji font" || echo "⚠️ iOS18_4.ttf missing"
          exit $MISSING

      - name: 📝 Validate JSON files
        run: |
          python3 << 'EOF'
          import json, sys, os
          files = ['manifest.json','capacitor.config.json','package.json']
          ok = True
          for f in files:
            if os.path.exists(f):
              try:
                json.load(open(f))
                print(f"✅ {f}")
              except json.JSONDecodeError as e:
                print(f"❌ {f}: {e}")
                ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: 🏷️ Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version package.json 2>/dev/null || echo '2.0.0')"
          fi
          BUILD="${GITHUB_RUN_NUMBER:-1}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD"     >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION (build $BUILD)"

      - name: 🔒 Security scan
        run: |
          echo "🔒 Scanning for secrets…"
          if grep -rn "password\s*=\s*['\"][^'\"]\+['\"]" --include="*.html" --include="*.js" . 2>/dev/null | grep -v "test\|mock\|example\|placeholder" | grep -v ".git"; then
            echo "⚠️ Potential hardcoded credentials detected – review before release"
          else
            echo "✅ No hardcoded credentials found"
          fi
          echo "✅ Security scan complete"

      - name: 🌐 PWA audit
        run: |
          echo "🌐 PWA Checklist:"
          python3 -c "
          import json
          m = json.load(open('manifest.json'))
          checks = {
            'name':         'name'         in m,
            'start_url':    'start_url'    in m,
            'display':      'display'      in m,
            'icons':        bool(m.get('icons')),
            'theme_color':  'theme_color'  in m,
            'background':   'background_color' in m,
          }
          for k,v in checks.items():
            print(f\"  {'✅' if v else '❌'} {k}\")
          "
          [ -f sw.js ] && echo "  ✅ Service Worker" || echo "  ❌ Service Worker missing"

# ──────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: |
          npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
          npm install -g @capacitor/cli

      - name: 📱 Setup Android platform
        run: |
          npx cap add android 2>/dev/null || echo "Android platform already exists"
          echo "✅ Android platform ready"

      - name: 🧰 Ensure Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew missing – restoring from @capacitor/cli's bundled template"
            TEMPLATE_DIR=$(node -e "console.log(require('path').dirname(require.resolve('@capacitor/cli/package.json')))")
            mkdir -p /tmp/android-template
            tar -xzf "$TEMPLATE_DIR/assets/android-template.tar.gz" -C /tmp/android-template
            cp /tmp/android-template/gradlew android/gradlew
            cp /tmp/android-template/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/android-template/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            cp /tmp/android-template/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
            # The bundled template ships an older Gradle than our AGP (8.2.2) needs (min 8.2) — pin a compatible one
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2.1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
            chmod +x android/gradlew
            echo "✅ Gradle wrapper restored (Gradle 8.2.1, matching AGP 8.2.2)"
          else
            echo "✅ gradlew already present"
          fi

          if ! grep -q "capacitor.settings.gradle" android/settings.gradle; then
            printf '\napply from: "capacitor.settings.gradle"\n' >> android/settings.gradle
            echo "✅ Wired capacitor.settings.gradle into settings.gradle (plugin modules)"
          else
            echo "✅ settings.gradle already wires capacitor.settings.gradle"
          fi

      - name: 📄 Prepare webDir
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          [ -f branding.json ] && cp branding.json www/ || true
          cp -r assets www/
          echo "✅ www/ ready ($(du -sh www | cut -f1))"

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🎨 Generate icons
        run: |
          pip install Pillow --break-system-packages -q
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          src = 'assets/logo/logo.png'
          if not os.path.exists(src):
            print("⚠️ logo.png not found – creating placeholder")
            img = Image.new('RGBA',(1024,1024),(10,13,20,255))
            d = ImageDraw.Draw(img)
            d.ellipse([100,100,924,924],fill=(10,132,255,255))
          else:
            img = Image.open(src).convert('RGBA')

          base = 'android/app/src/main/res'
          densities = {
            'mipmap-ldpi':36,'mipmap-mdpi':48,'mipmap-hdpi':72,
            'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192,
          }
          for folder,size in densities.items():
            path = os.path.join(base,folder)
            os.makedirs(path,exist_ok=True)
            r = img.resize((size,size),Image.LANCZOS)
            bg = Image.new('RGB',(size,size),(0,0,0))
            bg.paste(r,(0,0),r)
            bg.save(os.path.join(path,'ic_launcher.png'))
            # Round
            mask = Image.new('L',(size,size),0)
            ImageDraw.Draw(mask).ellipse([0,0,size-1,size-1],fill=255)
            rnd = Image.new('RGB',(size,size),(0,0,0))
            rnd.paste(bg,(0,0))
            rnd.putalpha(mask)
            fin = Image.new('RGB',(size,size),(0,0,0))
            fin.paste(rnd,(0,0),rnd)
            fin.save(os.path.join(path,'ic_launcher_round.png'))
            print(f'  ✅ {folder}: {size}px')
          PYEOF

      - name: 📝 Set version in build.gradle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BUILD="${{ needs.validate.outputs.build }}"
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionName\s*\"[^\"]*\"/versionName \"${VERSION}\"/"     android/app/build.gradle
            sed -i "s/versionCode\s*[0-9]*/versionCode ${BUILD}/" android/app/build.gradle
            echo "✅ Version set: $VERSION (code: $BUILD)"
          fi

      - name: 🔑 Decode keystore (release builds)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > linka.keystore
            echo "LINKA_STORE_FILE=$(pwd)/linka.keystore"  >> $GITHUB_ENV
            echo "LINKA_STORE_PASSWORD=${KEYSTORE_STORE_PASSWORD}" >> $GITHUB_ENV
            echo "LINKA_KEY_ALIAS=${KEYSTORE_ALIAS}"               >> $GITHUB_ENV
            echo "LINKA_KEY_PASSWORD=${KEYSTORE_KEY_PASSWORD}"     >> $GITHUB_ENV
            echo "✅ Keystore decoded"
          else
            echo "ℹ️ No keystore secret set – skipping (unsigned release build)"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: 🔐 Ensure debug keystore
        working-directory: android
        run: |
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore missing – generating standard Android debug keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✅ debug.keystore generated"
          else
            echo "✅ debug.keystore already present"
          fi

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            2>&1
          echo "✅ Debug APK built"

      - name: 🏛️ Build Release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            2>&1
          echo "✅ Release APK built"

      - name: 📦 Build Release AAB
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            2>&1
          echo "✅ Release AAB built"

      - name: 📁 Collect artifacts
        run: |
          mkdir -p dist/android
          find android -name "*.apk" -exec cp {} dist/android/ \;
          find android -name "*.aab" -exec cp {} dist/android/ \;
          echo "📦 Artifacts:"
          ls -lah dist/android/
          if [ -z "$(ls -A dist/android/ 2>/dev/null)" ]; then
            echo "::error::No APK/AAB was produced — a Gradle build step above must have failed."
            exit 1
          fi

      - name: ✅ Generate SHA256 checksums
        run: |
          cd dist/android
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: 📤 Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linka-android-${{ needs.validate.outputs.version }}-${{ github.run_number }}
          path: dist/android/
          retention-days: 30
          compression-level: 6

      - name: 📦 Isolate release APK
        run: |
          mkdir -p dist/release-apk-only
          RELEASE_APK=$(find android -path "*apk/release*" -name "*.apk" | head -n1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK not found — cannot publish standalone artifact."
            exit 1
          fi
          cp "$RELEASE_APK" dist/release-apk-only/linka-release.apk
          echo "✅ Isolated: $RELEASE_APK -> dist/release-apk-only/linka-release.apk"
          ls -lah dist/release-apk-only/

      - name: 📤 Upload release APK (standalone)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linka-release-apk-${{ needs.validate.outputs.version }}-${{ github.run_number }}
          path: dist/release-apk-only/linka-release.apk
          retention-days: 30
          compression-level: 0

      - name: 📊 Build summary
        run: |
          echo "## 🤖 Android Build — LINKA v${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artefak | Ukuran |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/android/*; do
            [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -sh $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done

# ──────────────────────────────────────
  build-pwa:
    name: 🌐 Build & Deploy PWA
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 📦 Bundle PWA
        run: |
          mkdir -p dist/pwa
          cp index.html manifest.json sw.js branding.json dist/pwa/ 2>/dev/null || true
          cp -r assets dist/pwa/
          echo "✅ PWA bundled ($(du -sh dist/pwa | cut -f1))"

      - name: 📝 Generate version file
        run: |
          echo '{
            "version":  "${{ needs.validate.outputs.version }}",
            "build":    "${{ needs.validate.outputs.build }}",
            "commit":   "${{ github.sha }}",
            "branch":   "${{ github.ref_name }}",
            "built_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          }' > dist/pwa/version.json

      - name: 📤 Upload PWA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linka-pwa-${{ needs.validate.outputs.version }}-${{ github.run_number }}
          path: dist/pwa/
          retention-days: 30

      - name: 🚀 Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  dist/pwa
          commit_message: "🚀 Deploy LINKA v${{ needs.validate.outputs.version }} [skip ci]"

# ──────────────────────────────────────
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ validate, build-android, build-pwa ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_release == true)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ⬇️ Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linka-android-${{ needs.validate.outputs.version }}-${{ github.run_number }}
          path: release/android

      - name: ⬇️ Download PWA artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linka-pwa-${{ needs.validate.outputs.version }}-${{ github.run_number }}
          path: release/pwa

      - name: 📦 Zip PWA
        run: zip -r release/linka-pwa-${{ needs.validate.outputs.version }}.zip release/pwa/

      - name: 📋 Generate release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # LINKA v${{ needs.validate.outputs.version }}

          **Connected Without Limits** — Offline · Private · Borderless

          ## Unduh

          | Platform | File | Keterangan |
          |----------|------|-----------|
          | Android APK (Debug) | `linka-debug.apk` | Untuk testing langsung |
          | Android APK (Release) | `linka-release-unsigned.apk` | Produksi (unsigned) |
          | Android AAB | `linka-release.aab` | Google Play Store |
          | PWA | `linka-pwa-*.zip` | Web App |

          ## Yang Baru
          - Glass morphism UI + fluid animated background
          - Font: LINKA800 (teks) + iOS 18.4 Apple Color Emoji (emoji di chat)
          - Bottom nav liquid glass dengan indikator JS-driven
          - Screen: Obrolan, Kontak, Jaringan, Pengaturan, Profil
          - Tema background: 5 varian (Blue, Cyber, Warm, Emerald, Rose)
          - Semua ikon UI sebagai SVG inline (bukan emoji)
          - Emoji di chat menggunakan font iOS 18.4 (tidak bisa diubah)
          - GitHub Actions: APK + AAB + PWA auto-build

          ## Keamanan
          - X25519 key exchange
          - ChaCha20-Poly1305 encryption
          - Ed25519 digital signatures
          - Forward secrecy

          ## Verifikasi Integritas
          ```
          sha256sum linka-*.apk
          ```
          EOF

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "LINKA v${{ needs.validate.outputs.version }}"
          body_path:  RELEASE_NOTES.md
          draft:      false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            release/android/*.apk
            release/android/*.aab
            release/android/checksums.sha256
            release/linka-pwa-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
